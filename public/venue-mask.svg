<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="none">
  <defs>
    <filter id="brush" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.009 0.015"
        numOctaves="3"
        seed="9"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="18"
        xChannelSelector="R"
        yChannelSelector="G"
      />
      <feGaussianBlur stdDeviation="11" />
    </filter>
  </defs>
  <rect x="30" y="26" width="340" height="248" rx="14" fill="#fff" filter="url(#brush)" />
</svg>
