<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="none">
  <defs>
    <filter id="brush" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.011 0.019"
        numOctaves="4"
        seed="7"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="28"
        xChannelSelector="R"
        yChannelSelector="G"
      />
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>
  <rect x="16" y="14" width="368" height="272" rx="14" fill="#fff" filter="url(#brush)" />
</svg>
